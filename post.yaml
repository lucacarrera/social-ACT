# Coda dei post da pubblicare.
#
# Per ogni post:
#   id:          nome breve e univoco (lettere, numeri, - _ .)
#   testo:       testo del post
#   immagine:    percorso della locandina nel repository
#   date:        elenco di date e orari di pubblicazione, ora italiana, formato "AAAA-MM-GG HH:MM"
# Facoltativi:
#   piattaforme:     [facebook, instagram] (default: entrambe)
#   testo_instagram: testo diverso per Instagram (default: uguale a "testo")
#   sfondo:          colore delle bande aggiunte alla locandina per Instagram
#                    ("auto" = colore del bordo della locandina, oppure es. "#ffffff")
#
# Gli orari vengono controllati ogni 15 minuti: un post delle 18:00 esce tra le 18:00 e le 18:20 circa.
# I post usciti si vedono in stato/pubblicati.json. Non serve cancellare i post vecchi.

post:
  - id: pasta-fresca-pasta-ripiena
    testo: |
      Tutti con le mani in "pasta", assieme al nostro chef, per imparare a preparare tagliatelle, farfalle, orecchiette, pasta ripiena creativa.

      Giovedì 19 e 26 novembre, dalle 19.30 alle 22.30.

      Al termine della lezione ci sarà la degustazione dei piatti preparati.

      Per informazioni o iscrizione contattare la segreteria al n. 335 1841388 o via email all'indirizzo segreteria@cuochitorino.it o visitare la pagina https://cuochitorino.it/product/corso-di-pasta-fresca-e-ripiena/
