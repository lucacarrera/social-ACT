  - id: corso-cucina-professionale
    testo: |
      Hai sempre sognato di lavorare in una cucina professionale? 🔥

      A gennaio ripartono i nostri Corsi di Cucina Professionale: 9 settimane con le mani in pasta, in brigata, al fianco degli chef dell'Associazione Cuochi Torino.

      Lavori, studi o hai il weekend libero? Abbiamo pensato a tutti, con tre edizioni:
      ▪️ Pomeridiana: mar e gio 14.00–17.30, dal 26 gennaio
      ▪️ Serale: lun e mer 19.00–22.30, dal 25 gennaio
      ▪️ Sabato: 9.00–14.00, dal 23 gennaio

      I posti sono limitati: scrivici o chiamaci per informazioni e iscrizioni
      📞 335 184 1388 · ✉️ segreteria@cuochitorino.it
      📍 Via Bogino 17, Torino

      #cucinaprofessionale #diventarecuoco #corsodicucina #Torino #AssociazioneCuochiTorino
